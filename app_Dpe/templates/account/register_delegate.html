{% extends "account/base.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>استمارة إدخال مندوب</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css " rel="stylesheet">

<!-- Police Arabe -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400 ;700&display=swap" rel="stylesheet">

<!-- Style Global -->
<link href="{% static 'css/style.css' %}" rel="stylesheet">

<style>
/* Style identique au login */
   body, h1, h2, h3, h4, h5, h6, p, a, button {
        font-family: "Times New Roman", "Tajawal", sans-serif !important;
        direction: rtl;
        text-align: right;
    }
      body {
        background: linear-gradient(135deg, #ffffff, #ffffff, #ffffff);
        min-height: 150vh;
        display: flex;
        flex-direction: column;
    }
    
    /* ==========================
       NAVBAR LOGIN (comme login.html)
    =========================== */
    .navbar-login {
        background-color: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        padding: 6px 0;
    }

    .navbar-login .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar-login .logo-nav {
        height: 50px;
        width: auto;
        object-fit: contain;
        transition: transform 0.3s ease;
    }

    .navbar-login .logo-nav:hover {
        transform: scale(1.05);
    }

    .navbar-login .text-tunisie {
        font-family: "Times New Roman", serif;
        font-weight: 600;
        font-size: 16px;
        line-height: 1.2;
        color: #003366;
    }

    @media (max-width: 768px) {
        .navbar-login .text-tunisie {
            display: none;
        }
        .navbar-login .logo-nav {
            height: 40px;
        }
    }

    /* Style pour cacher les logos DPE dans la navbar */
    .navbar-brand img[src*="dpe"], 
    .navbar-brand img[src*="DPE"],
    .navbar img[src*="dpe"],
    .navbar img[src*="DPE"] {
        max-height: 30px !important;
        width: auto !important;
    }

.card-custom {
    width: 600px;
    margin: 30px auto;
    border-radius: 14px;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    overflow: hidden;
}

.card-header-custom {
    background: #0d6efd;
    padding: 18px;
    text-align: center;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.form-control {
    border-radius: 10px;
    padding: 10px;
    direction: rtl;
    text-align: right;
}

.form-label {
    font-weight: bold;
    margin-bottom: 5px;
}

.btn-primary-custom {
    background: #0d6efd;
    border: none;
    padding: 10px;
    border-radius: 10px;
    width: 100%;
    font-weight: bold;
    transition: 0.2s;
}

.btn-primary-custom:hover {
    background: #0b5ed7;
}

.small a {
    font-size: 14px;
    color: #0d6efd;
    text-decoration: none;
}

.small a:hover {
    text-decoration: underline;
}

</style>

</head>

<body class="bg-light" style="font-family: 'Tajawal', sans-serif;">

<div class="container">

    <div class="card card-custom">

        <div class="card-header-custom">
            استمارة إدخال مندوب
        </div>

        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <!-- الولاية -->
                <div class="mb-3">
                    <label class="form-label">الولاية *</label>
                    <select name="wilaya" id="wilaya" class="form-select" required>
                        <option value="">اختر الولاية</option>
                        <option value="01">تونس</option>
                        <option value="02">أريانة</option>
                        <option value="03">بن عروس</option>
                        <option value="04">منوبة</option>
                        <option value="05">نابل</option>
                        <option value="06">زغوان</option>
                        <option value="07">بنزرت</option>
                        <option value="08">سليانة</option>
                        <option value="09">الكاف</option>
                        <option value="10">سوسة</option>
                        <option value="11">المنستير</option>
                        <option value="12">المهدية</option>
                        <option value="13">صفاقس</option>
                        <option value="14">القيروان</option>
                        <option value="15">القصرين</option>
                        <option value="16">سيدي بوزيد</option>
                        <option value="17">قابس</option>
                        <option value="18">مدنين</option>
                        <option value="19">تطاوين</option>
                        <option value="20">قبلي</option>
                        <option value="21">توزر</option>
                        <option value="22">جندوبة</option>
                        <option value="23">باجة</option>
                        <option value="24">الكاف</option>
                    </select>
                </div>

                <!-- المعرّف الوحيد -->
                <div class="mb-3">
                    <label class="form-label">الرمز</label>
                    <input type="text" id="unique_id_preview" class="form-control" readonly placeholder="D13_...">
                    <label class="form-label">المعرّف الوحيد *</label>
                    <input type="text" name="unique_number" class="form-control mt-2" placeholder="أدخل الرقم (12 رقم)" pattern="\d{12}" maxlength="12" required>
                </div>

                <!-- الاسم -->
                <div class="mb-3">
                    <label class="form-label">الاسم *</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>

                <!-- اللقب -->
                <div class="mb-3">
                    <label class="form-label">اللقب *</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>

                <!-- الصفة -->
                <div class="mb-3">
                    <label class="form-label">الصفة *</label>
                    <select name="role" class="form-select" required>
                        <option value="">اختر الصفة</option>
                        <option value="central">مندوب مركزي</option>
                        <option value="regional">مندوب جهوي</option>
                        <option value="assistant">مندوب حماية طفولة مساعد</option>
                        <option value="assistant_first">مندوب حماية الطفولة رتبة أولى</option>
                        <option value="regional_second">مندوب حماية الطفولة رتبة ثانية</option>
                        <option value="regional_third">مندوب حماية الطفولة رتبة ثالثة</option>
                        <option value="social_specialist">أخصائي اجتماعي</option>
                        <option value="psychologist">أخصائي نفسي</option>
                        <option value="administrator">إطار إداري</option>
                        <option value="administrative_assistant">عون إداري</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <!-- الهاتف -->
                <div class="mb-3">
                    <label class="form-label">الهاتف</label>
                    <input type="text" name="phone" class="form-control">
                </div>

                <!-- البريد الإلكتروني -->
                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <!-- كلمة السر -->
                <div class="mb-3">
                    <label class="form-label">كلمة السر *</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

          <div class="text-center mt-3">
    <button style="background-color: #0d6efd; color: white; padding: 10px 25px; border-radius: 10px; border: none; font-weight: bold;">
        تسجيل المندوب
    </button>
</div>


            </form>

        </div>

        <div class="card-footer text-center py-3">
            <div class="small">
                <a href="{% url 'login' %}">لديك حساب؟ تسجيل الدخول</a>
            </div>
        </div>

    </div>
</div>

<script>
document.getElementById('wilaya').addEventListener('change', function() {
    const wilaya = this.value;
    const preview = document.getElementById('unique_id_preview');

    if (!wilaya) {
        preview.value = '';
        return;
    }

    fetch("{% url 'ajax_next_delegate_id' %}?wilaya=" + encodeURIComponent(wilaya))
        .then(resp => resp.json())
        .then(data => {
            preview.value = data.next_id || "خطأ في الحصول على المعرّف";
        })
        .catch(() => {
            preview.value = "خطأ في الشبكة";
        });
});
</script>
 <!-- FOOTER -->
    {% include "account/footer.html" %}
</body>
</html>
{% endblock %}
