<!DOCTYPE html>
{% load static %}
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pied de page en bas</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    /* Réinitialisation de base */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Le conteneur principal prend tout l’espace disponible */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    /* Contenu principal */
    main {
      flex: 1; /* pousse le footer vers le bas */
      padding: 20px;
    }

    /*---------------------------------------
       Footer
    -----------------------------------------*/
    footer {
      background-color: #212529;
      color: white;
      text-align: center;
      padding: 20px 0;
      width: 100%;
    }

    .fa {
      padding: 10px;
      font-size: 20px;
      width: 40px;
      text-align: center;
      text-decoration: none;
      margin: 5px 2px;
      border-radius: 50%;
      color: white;
    }

    .fa:hover {
      opacity: 0.7;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main>
    <h1></h1>
    <p></p>
  </main>

  <footer class="footer">
  <div class="container">
    <div class="row align-items-center">

      <!-- Logo ou texte gauche -->
      <div class="col-md-4 text-center text-md-left mb-3 mb-md-0">
        <img src="{% static 'images/tunisie.png' %}" alt="République Tunisienne" class="footer-logo">
      </div>

      <!-- Texte central -->
      <div class="col-md-4 text-center mb-3 mb-md-0">
        <p class="footer-text mb-0">
          وزارة الأسرة والمرأة والطفولة وكبار السن  &copy; {% now 'Y' %}
        </p>
      </div>

    </div>
  </div>
</footer>

<style>
  /* Footer global */
  .footer {
    background-color: #003366;
    color: #fff;
    padding: 20px 0;
    font-family: "Times New Roman", serif;
  }

  .footer-logo {
    height: 40px;
  }

  .footer-text {
    font-size: 14px;
  }

  /* Icones réseaux sociaux */
  .fa {
    padding: 10px;
    font-size: 18px;
    width: 36px;
    height: 36px;
    text-align: center;
    text-decoration: none;
    margin: 0 5px;
    border-radius: 50%;
    background-color: #005a9e;
    color: white;
    transition: 0.3s;
  }

  .fa:hover {
    background-color: #0075c9;
    transform: scale(1.1);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .footer .col-md-4 {
      margin-bottom: 15px;
    }
  }
</style>


</body>
</html>
